# Deploy the docneural site to GitHub Pages.
#
# Triggered by every push to ai/main plus workflow_dispatch. The corpus is
# site-corpus/ — the REAL manuals (Emacs 30.1 via makeinfo, the published
# Org and Guix node-split HTML), converted by the Owner's org-import
# package (git.khalidrafi.tech/org-pandoc-import) through
# scripts/manuals-corpus.py, and committed, so the build needs no network,
# no pandoc and no emacs: 1386 nodes / 30915 wires across 3 sources.
# Regeneration steps: site-corpus/README.org.
#
# Concurrency: group "pages" — only the latest build matters for a static
# site, so superseded runs cancel instead of racing to deploy.
name: deploy-pages

on:
  push:
    branches: [ai/main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Sibling checkouts: docneural/vite.config.ts resolves the theme and
      # the roam UI at ../docneural-ui and ../org-roam-lite-ui, so the three
      # repos land side by side exactly like a local dev checkout.
      - uses: actions/checkout@v4
        with: { path: docneural }
      - uses: actions/checkout@v4
        with: { repository: khaalidrafi/docneural-ui, ref: ai/main, path: docneural-ui }
      - uses: actions/checkout@v4
        with:
          repository: khaalidrafi/org-roam-lite-ui
          ref: ai/main
          path: org-roam-lite-ui
          # org-roam-lite-ui is PRIVATE: GITHUB_TOKEN is docneural-scoped,
          # so this checkout rides the repo's cross-repo GH_PAT secret.
          token: ${{ secrets.GH_PAT }}

      - name: Install Emacs (batch exporter) + Node 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq emacs-nox
          emacs --version | head -1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docneural/package-lock.json

      - name: Export + slim the manuals corpus (emacs batch -> graph.json + ctx/ + docs/)
        working-directory: docneural
        run: make export CORPUS=site-corpus DOC="org emacs guix" OUT=.export

      - name: Build (base=/docneural/ for the Pages project site)
        working-directory: docneural
        run: |
          npm ci --no-audit --no-fund
          make build BASE_FLAG=--base=/docneural/

      - name: "Smoke the shipped artifact (Pages layout /docneural/)"
        working-directory: docneural
        run: |
          # Pages serves the artifact ROOT under the /docneural/ prefix, so
          # dist/ keeps vite's flat layout while index.html URLs carry base.
          test -f dist/graph.json
          test -f dist/graph.json.br
          test -f dist/docs/org--index.html
          test -f dist/docs/emacs--Basic-Files.html
          test -f dist/docs/guix--index.html
          test -f dist/ctx/org--index.json
          grep -q '/docneural/assets/' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docneural/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
