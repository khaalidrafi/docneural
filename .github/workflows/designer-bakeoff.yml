name: designer-bakeoff

# Blind Web Designer bake-off across OWNER-KEYS vision lanes (HIRE LAW).
# Keys stay in Actions secrets; only blind-coded outputs land in the artifact.
# Dispatched manually; never runs on push.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: designer-bakeoff
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # ci/ = agent-team-ci kit (dual-law brief)

      - name: compose the dual-law brief (ci contract §3 — every lane runs lawed)
        run: |
          printf '%s\n' 'Lane: blind Web Designer bake-off judge. Task prompts are embedded in scripts/designer-bakeoff.mjs (planted-defect QA + deployed-shot critique). Follow the global + local law above in every review reply (English-only, evidence-first).' > /tmp/segment-brief.txt
          bash ci/bin/law_brief.sh /tmp/segment-brief.txt "$PWD" > "$PWD/.law-brief.txt"
          echo "CI_LAW_BRIEF_FILE=$PWD/.law-brief.txt" >> "$GITHUB_ENV"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "run blind bake-off — keys stay sealed"
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTLING_API_KEY: ${{ secrets.ANTLING_API_KEY }}
          GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
        run: node scripts/designer-bakeoff.mjs

      - name: upload bench outputs
        uses: actions/upload-artifact@v4
        with:
          name: bench-out
          path: bench-out/
          retention-days: 7
