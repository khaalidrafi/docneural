name: design-forge-codebuddy

# PAID-CREDIT forge round (Owner order 2026-10-27): "quickly burn 75 credits
# from codebuddy to perform some quality work with a good paid model, not ds
# v4.1 flash which is free this month. The credits are expiring!!"
#
# CodeBuddy CLI (bodies law: BUILT-IN models only) generates forge entries
# from the SAME brief as round 1; the sealed antling/gemini lanes judge;
# scripts/design-forge.mjs does render + objective + blind peers + composite
# (FORGE_STAGED_ONLY=1 — API lanes judge, never generate here).
# deepseek-v4.1-flash is hard-excluded in the generator (Owner fiat).
# Dispatched manually; never runs on push. Credits are money — keep the
# model list short and purposeful. PAID-LANE SPEND LAW (TEAM.md, Owner
# 2026-10-27 19:02 "limited credits"): the generator fires EXACTLY ONE paid
# generation per model (no env-variant spray, no retries, spend cap
# hard-enforced) and files a spend ledger in forge-codebuddy-gen-report.json.

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'codebuddy paid models (CLI-supported ids from --help; kimi-k3 = Design Arena 1335, #2 designer on the whole public board)'
        default: 'kimi-k3'
        required: false
      seed:
        description: 'blind shuffle seed'
        default: '20261028'
        required: false

permissions:
  contents: read

concurrency:
  group: design-forge-codebuddy
  cancel-in-progress: false

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # ci/ = agent-team-ci kit (dual-law brief)

      - name: compose the dual-law brief (ci contract §3 — every lane runs lawed)
        run: |
          printf '%s\n' 'Lane: PAID-CREDIT forge generator via codebuddy bodies. The generation brief is embedded in scripts/forge-codebuddy-gen.mjs (scripts/forge-brief.md). SPEND LAW: exactly ONE paid generation per model, no retries, deepseek-v4.1-flash excluded. Follow the global + local law above in every generated artifact.' > /tmp/segment-brief.txt
          bash ci/bin/law_brief.sh /tmp/segment-brief.txt "$PWD" > "$PWD/.law-brief.txt"
          echo "CI_LAW_BRIEF_FILE=$PWD/.law-brief.txt" >> "$GITHUB_ENV"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install codebuddy body + playwright chromium
        run: |
          npm i -g @tencent-ai/codebuddy-code
          codebuddy --version || true
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: "generate entries via codebuddy — PAID credits burn here ( Owner-excluded: deepseek-v4.1-flash )"
        env:
          CODEBUDDY_AUTH_TOKEN: ${{ secrets.CODEBUDDY_AUTH_TOKEN }}
          # same secret in the documented API-key slot — "in non-interactive
          # mode (-p) this key is always used" (Tencent doc product/1316/84430)
          CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_AUTH_TOKEN }}
        run: node scripts/forge-codebuddy-gen.mjs "${{ github.event.inputs.models || 'kimi-k3' }}"

      - name: "render + objective + blind peer (antling/gemini judge-only) + composite"
        env:
          FORGE_STAGED_ONLY: '1'
          FORGE_SEED: ${{ github.event.inputs.seed || '20261028' }}
          ANTLING_API_KEY: ${{ secrets.ANTLING_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/design-forge.mjs

      - name: upload forge outputs
        uses: actions/upload-artifact@v4
        with:
          name: forge-out-codebuddy
          path: |
            forge-out/
            forge-codebuddy-gen-report.json
            scripts/forge-staging/
          retention-days: 7
