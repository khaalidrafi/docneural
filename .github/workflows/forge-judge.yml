name: forge-judge

# Judge-only completion pass for the DESIGN forge (stage 2). Fills the missing
# blind peer pairs from the COMMITTED renders so no crowned score rests on an
# objective-only number. Keys stay in Actions secrets. Dispatched manually.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-judge
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # ci/ = agent-team-ci kit (dual-law brief)

      - name: compose the dual-law brief (ci contract §3 — every lane runs lawed)
        run: |
          printf '%s\n' 'Lane: forge judge completion pass — fills missing blind peer pairs from committed renders (scripts/forge-judge.mjs, committed rubric). Follow the global + local law above in every review reply (English-only, evidence-first).' > /tmp/segment-brief.txt
          bash ci/bin/law_brief.sh /tmp/segment-brief.txt "$PWD" > "$PWD/.law-brief.txt"
          echo "CI_LAW_BRIEF_FILE=$PWD/.law-brief.txt" >> "$GITHUB_ENV"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "complete the blind peer matrix — keys stay sealed"
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTLING_API_KEY: ${{ secrets.ANTLING_API_KEY }}
          GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
        run: node scripts/forge-judge.mjs

      - name: upload judge outputs
        uses: actions/upload-artifact@v4
        with:
          name: forge-judge-out
          path: forge-judge-out/
          retention-days: 7
