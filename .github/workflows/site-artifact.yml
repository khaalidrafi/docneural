# docneural SITE ARTIFACT FORGE (Pages RETIRED — Owner order 2026-11-02:
# "take down gh pages for docneural since we hv workers now"; the canonical
# host is the CF Worker dn-site -> https://docneural.khalidrafi.tech, deployed
# by `make build` + `npx wrangler deploy` per wrangler.jsonc).
#
# This workflow is the MANUAL ARTIFACT FORGE only (workflow_dispatch — no
# push trigger): it builds the full corpus assembly (graph.json + docs/ +
# ctx/) on clean runners so a local lead can graft docs/ctx from the last
# green artifact instead of re-exporting 44 MB locally. It does NOT publish
# anywhere.
#
# The corpus is site-corpus/ — the REAL manuals (Emacs 30.1 via makeinfo,
# the published Org and Guix node-split HTML), converted by the Owner's
# org-import package (git.khalidrafi.tech/org-pandoc-import) through
# scripts/manuals-corpus.py, and committed, so the build needs no network,
# no pandoc and no emacs: 1386 nodes / 30915 wires across 3 sources.
# Regeneration steps: site-corpus/README.org.
name: site-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Sibling checkouts: docneural/vite.config.ts resolves the theme and
      # the roam UI at ../docneural-ui and ../org-roam-lite-ui, so the three
      # repos land side by side exactly like a local dev checkout.
      - uses: actions/checkout@v4
        with: { path: docneural }
      - uses: actions/checkout@v4
        with: { repository: khaalidrafi/docneural-ui, ref: ai/main, path: docneural-ui }
      - uses: actions/checkout@v4
        with:
          repository: khaalidrafi/org-roam-lite-ui
          ref: ai/main
          path: org-roam-lite-ui
          # org-roam-lite-ui is PRIVATE: GITHUB_TOKEN is docneural-scoped,
          # so this checkout rides the repo's cross-repo GH_PAT secret.
          token: ${{ secrets.GH_PAT }}

      - name: Install Emacs (batch exporter) + Node 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq emacs-nox
          emacs --version | head -1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docneural/package-lock.json

      - name: Export + slim the manuals corpus (emacs batch -> graph.json + ctx/ + docs/)
        working-directory: docneural
        run: make export CORPUS=site-corpus DOC="org emacs guix" OUT=.export

      - name: Build (apex base — the canonical host is the zone apex)
        working-directory: docneural
        run: |
          npm ci --no-audit --no-fund
          make build

      - name: "Smoke the shipped artifact (apex layout)"
        working-directory: docneural
        run: |
          test -f dist/graph.json
          test -f dist/graph.json.br
          # The bridge synapses fetch ./bridges.json from the dist ROOT — a
          # missing copy 404s live and the store's silent-continue fallback
          # hides the whole feature (no amber wires, no "+2 recovered").
          test -f dist/bridges.json
          test -f dist/docs/org--index.html
          test -f dist/docs/emacs--Basic-Files.html
          test -f dist/docs/guix--index.html
          test -f dist/ctx/org--index.json
          grep -q '/assets/' dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: docneural/dist
          retention-days: 30
