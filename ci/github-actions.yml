name: ci

on:
  push:
    branches: [ai/main, 'ai/**']
  pull_request:

jobs:
  # Everything the site build needs, on a clean checkout: the two sibling
  # repos the vite aliases consume (theme at ../docneural-ui, the REAL
  # org-roam-lite-ui at ../org-roam-lite-ui — published, no shim), the
  # latest Org from GNU ELPA, the bundled demo corpus, the link gate, and
  # the gates that catch a broken theme contract (vitest + svelte-check)
  # in BOTH repos.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # BEFORE anything builds: the site imports docneural-ui from ../docneural-ui
      # and the theme imports orui/* from ../org-roam-lite-ui (aliases in
      # vite.config.ts). Cloning the real orui is also the standing
      # swap-in check: if its contract with the theme breaks, this job goes
      # red here instead of in production graph mode.
      - name: Clone sibling dependencies
        run: |
          git clone --depth 1 -b ai/cloud https://github.com/khaalidrafi/docneural-ui.git ../docneural-ui
          git clone --depth 1 -b ai/main https://github.com/khaalidrafi/org-roam-lite-ui.git ../org-roam-lite-ui
          cd ../org-roam-lite-ui && npm ci --no-audit --no-fund

      - name: Install site deps
        run: npm ci --no-audit --no-fund

      - name: Byte-compile exporter on latest Org
        run: |
          make org-latest
          make check ORG_LOAD=build/org-9.8.10

      - name: Export the demo corpus
        run: make export CORPUS=demo DOC=demo OUT=.export ORG_LOAD=build/org-9.8.10

      - name: Linkcheck
        run: make linkcheck OUT=.export

      - name: Unit tests (site)
        run: npx vitest run

      - name: Build the site
        run: make build

      - name: svelte-check (site)
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Theme repo (tests, types, build)
        run: |
          cd ../docneural-ui
          npm ci --no-audit --no-fund
          npx vitest run
          npx svelte-check --output machine
          npm run build

  # Ship it: the DEMO-corpus build to GitHub Pages on every push to ai/cloud.
  # Honest scope: the full manuals need the org-docs corpus (~/docs), which
  # lives on the build machine, not in CI — so Pages carries the demo site
  # (reader at /, money page at /cloud.html) until a corpus-backed deploy
  # runs where the corpus is. Enable in Settings -> Pages -> Source:
  # GitHub Actions (the pushing token here lacks the pages scope).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/ai/cloud'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone sibling dependencies
        run: |
          git clone --depth 1 -b ai/cloud https://github.com/khaalidrafi/docneural-ui.git ../docneural-ui
          git clone --depth 1 -b ai/main https://github.com/khaalidrafi/org-roam-lite-ui.git ../org-roam-lite-ui
          cd ../org-roam-lite-ui && npm ci --no-audit --no-fund

      - name: Install site deps
        run: npm ci --no-audit --no-fund

      - name: Build the demo site
        run: |
          make org-latest
          make export CORPUS=demo DOC=demo OUT=.export ORG_LOAD=build/org-9.8.10
          make build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
