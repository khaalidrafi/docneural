<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>docneural — technical manuals, wired as synapses</title>
    <meta name="description" content="Documentation aggregator for any number of technical manuals (currently GNU Emacs, GNU Guix and Org): browse every node in the reader or the org-roam citation graph. Built by batch Emacs ox-html from ~/docs; themed by docneural-ui." />
    <!-- Night is the house style, not an afterthought: dark first, the day
         theme a deliberate switch. Painted before CSS loads so a cold browser
         never flashes white behind the HUD. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#05070d" />
    <!-- Mass-publish cards: the corpus as a wired manual set. -->
    <meta property="og:title" content="docneural — technical manuals, wired as synapses" />
    <meta property="og:description" content="Browse every node of the GNU Emacs, GNU Guix and Org manuals in a reader or an org-roam citation graph." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://khaalidrafi.github.io/docneural/" />
    <meta property="og:image" content="https://khaalidrafi.github.io/docneural/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="docneural — the Emacs, Guix and Org manuals wired as a neural graph" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://khaalidrafi.github.io/docneural/social-card.png" />
    <style>
      html { background: #05070d; color: #d5e4f2; }
    </style>
    <!-- Inline SVG mark: a lit soma with two firing wires. A data URI means
         no extra request and no 404 in the console for a favicon the build
         does not ship. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070d'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2300e5ff'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2300e5ff' stroke-width='1.5' opacity='.5'/%3E%3Cpath d='M16 16 27 8M16 16 5 24' stroke='%23ff2d95' stroke-width='1' opacity='.7'/%3E%3Ccircle cx='27' cy='8' r='2' fill='%23ff2d95'/%3E%3Ccircle cx='5' cy='24' r='2' fill='%23ff2d95'/%3E%3C/svg%3E" />
    <!-- No webfont <link> here on purpose. A stylesheet from
         fonts.googleapis.com is render-blocking, so first paint waited on a
         DNS + TLS + CSS round trip before the font files even started — tens
         of seconds on this machine, minutes on a bad phone connection. The
         theme ships three self-hosted latin subsets with font-display: swap
         instead (see docneural-ui/styles/docneural-ui.css section 0). -->
  </head>
  <body class="dn-body">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
